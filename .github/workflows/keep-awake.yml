name: keep-awake

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: アプリにアクセスして起きた状態を保つ
        run: |
          url="https://konkatsu-ai-coach.streamlit.app"
          code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 90 "$url")
          echo "$(date -u '+%Y-%m-%d %H:%M:%S') UTC  status=$code"
          if [ "$code" != "200" ]; then
            echo "200以外が返りました。アプリの状態を確認してください。"
          fi
