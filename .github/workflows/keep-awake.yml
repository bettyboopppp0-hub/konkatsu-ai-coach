name: keep-awake

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: アプリにアクセスして起きた状態を保つ
        run: |
          url="https://konkatsu-ai-coach.streamlit.app/~/+/healthz"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "$url" || echo 000)
          echo "$(date -u '+%Y-%m-%d %H:%M:%S') UTC  healthz=$code"

          top=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
                "https://konkatsu-ai-coach.streamlit.app" || echo 000)
          echo "$(date -u '+%Y-%m-%d %H:%M:%S') UTC  top=$top"

          if [ "$code" = "000" ] && [ "$top" = "000" ]; then
            echo "アプリに到達できませんでした。"
            exit 1
          fi
